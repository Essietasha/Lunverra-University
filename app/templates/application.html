{% extends "layout.html" %}

{% block title %}
    Application
{% endblock %}

{% block body %}
<div class="container applicationWrapper my-3">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="applicationCard shadow p-4 rounded bg-light">
        <h2 class="form-title text-center mb-4">Lunverra Application Form</h2>

        <form method="POST" enctype="multipart/form-data">
          <div class="row g-3">

            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" id="firstName" class="form-control" autocomplete="off">
            </div>

            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" id="lastName" class="form-control" placeholder="Doe" name="lastname" autocomplete="off" required>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" autocomplete="off">
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" id="phone" class="form-control" name="phone" autocomplete="off" placeholder="+44 7000 000000" required>
            </div>

            <div class="col-md-6">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" id="dob" class="form-control" name="dob" autocomplete="off" required>
            </div>

            <div class="col-md-6">
              <label for="program" class="form-label">Program of Interest</label>
              <select id="program" class="form-select" name="program" autocomplete="off">
                <option selected disabled>Choose...</option>
                <option>BSc Computer Science</option>
                <option>BSc Engineering</option>
                <option>BSc Data Science</option>
                <option>BSc Psychology</option>
                <option>BSc Communications</option>
                <option>LLB Law</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="intake" class="form-label">Preferred Intake</label>
              <select id="intake" class="form-select" name="intake" autocomplete="off" required>
                <option selected disabled>Choose...</option>
                <option>September 2026</option>
                <option>April 2027</option>
              </select>
            </div>

            <div class="col-12">
              <label for="education" class="form-label">Educational Background</label>
              <textarea id="education" class="form-control" name="edubackground" autocomplete="off" rows="3" placeholder="List your previous institutions, qualifications..." required></textarea>
            </div>

            <!-- <div class="col-12">
              <label for="documents" class="form-label">Upload Supporting Documents</label>
              <input type="file" id="documents" class="form-control" accept=".pdf, .jpg, .png, .jpeg" multiple required>
            </div> -->

            <div class="col-12">
              <label for="message" class="form-label">Additional Message (Optional)</label>
              <textarea id="message" class="form-control" name="addMessage" autocomplete="off" rows="3" placeholder="Any additional information you want us to know?"></textarea>
            </div>

            <div class="col-12 text-center">
              <button type="submit" class="btn btn-dark px-4 mt-3">Submit Application</button>
            </div>

          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
